<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <div class="confirm-body">
    <mat-icon class="confirm-icon">{{ data.icon }}</mat-icon>
    <p>{{ data.message }}</p>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" [mat-dialog-close]="false">
    {{ data.cancelLabel }}
  </button>
  <button mat-flat-button type="button" class="confirm-accept" [mat-dialog-close]="true">
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
