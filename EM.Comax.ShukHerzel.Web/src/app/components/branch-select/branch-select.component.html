<app-page-shell>
  <app-page-header
    appHeader
    title="בחירת סניף"
    [subtitle]="branches().length > 0 ? branches().length + ' סניפים זמינים' : null" />

  <app-page-status
    [error]="error()"
    [loading]="loading()"
    [empty]="!loading() && !error() && branches().length === 0"
    loadingText="טוען סניפים..."
    emptyText="לא נמצאו סניפים" />

  @if (branches().length > 0) {
    <mat-radio-group
      class="branch-list"
      aria-label="בחירת סניף"
      [value]="selectedId()"
      (change)="selectedId.set($event.value)">
        @for (branch of branches(); track branch.id) {
          <mat-radio-button class="branch-card" [value]="branch.id">
            <span class="branch-body">
              <span class="branch-name">{{ branch.branchName }}</span>
              @if (branch.comaxStoreId) {
                <span class="branch-meta">קוד סניף {{ branch.comaxStoreId }}</span>
              }
            </span>
          </mat-radio-button>
        }
    </mat-radio-group>
  }

  <app-footer-action
    appFooter
    [label]="continueLabel()"
    [disabled]="selectedId() === null"
    (action)="enterBranch()" />
</app-page-shell>
